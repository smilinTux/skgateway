## SKGateway shared shadow configuration for profile 6073417e
## SHA-256: 6073417e80f1f50fcdcc1ded64f823af98ae1cf39c2e190dc5c9a1c094f22380
##
## Qualified non-Matter shared gateway profile.
## Loopback backend only - accessed via supervised ingress.
##
## SECURITY: This profile is served on 127.0.0.1:28880 only.
## Network access is mediated by a separate systemd socket/proxy unit
## that binds exclusively to the Tailscale interface (tailscale0:28880).
##
## BACKEND PROFILE:
## - qwen3.8-27b-huihui-abliterated-q4_k_m (chiap08 and chiap01)
## - Exact model and routing configuration from candidate ce85573
## - SKLegal and OpenRouter routes excluded (protected)
## - Auth-provider-pure authorization enforced

server:
  port: 28880
  bind: 127.0.0.1
  dashboard_port: 0
  dashboard_enabled: false

advertise:
  reconcile: hide

## Pooling matches exact profile 6073417e
pooling:
  default_max_concurrent: 20
  default_max_queue: 1000
  queue_timeout_ms: 300000
  capacity_domains:
    chiap08-qwen38:
      members: [chiap08-qwen38, "reg:qwen38"]
      max: 2
      maxQueue: 2
      queueTimeoutMs: 10000
    chiap01-qwen38:
      members: [chiap01-qwen38]
      max: 1
      maxQueue: 1
      queueTimeoutMs: 10000

## Backends - non-Matter only, exact profile 6073417e
backends:
  chiap01-qwen38:
    url: http://chiap01:18810/v1
    auth_type: none
    models:
      - qwen3.8-27b-huihui-abliterated-q4_k_m
    context_limit: 32768
    priority: 3

  chiap08-qwen38:
    url: http://chiap08:11439/v1
    auth_type: none
    models:
      - qwen3.8-27b-huihui-abliterated-q4_k_m
      - qwen3.8-chiap08
      - qwen3.8-vllm
    context_limit: 131072
    priority: 3

  ## SKLegal backend - EXCLUDED per profile 6073417e
