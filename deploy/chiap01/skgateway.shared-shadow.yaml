## Authorization via auth-provider-pure (remote authz)
authorization:
  enabled: true
  provider_url: http://127.0.0.1:28881/authorize
  provider_timeout_ms: 5000
  fallback_mode: deny

## Tools support
tools:
  guaranteed:
    - exec
    - read
    - write
    - edit
    - message
  max_budget: 16
  fallback_budget: 8
  call_limit: 10

## Streaming - exact profile settings
streaming:
  default: true
  force_header: x-skgateway-nonstream
  auto_nonstream:
    enabled: true
    trigger_if_body_bytes_ge: 40000
    trigger_if_messages_ge: 6
    trigger_if_tool_call_history_ge: 3

## Sanitizer - exact profile settings
sanitizer:
  max_system_bytes: 40000
  max_body_bytes: 120000
  keep_start: 2
  keep_end: 12
  strip_thinking: true

## Model limits - exact profile 6073417e
model_limits:
  qwen3.8-27b-huihui-abliterated-q4_k_m: { max_body_bytes: 800000, max_system_bytes: 320000 }
  qwen3.8-chiap08:                       { max_body_bytes: 800000, max_system_bytes: 320000 }
  qwen3.8-vllm:                          { max_body_bytes: 800000, max_system_bytes: 320000 }
  qwen3.8-27b-ud-q5_k_xl:                { max_body_bytes: 800000, max_system_bytes: 320000 }
  qwen3.8-27b:                           { max_body_bytes: 800000, max_system_bytes: 320000 }
  qwen38-abliterated:                    { max_body_bytes: 800000, max_system_bytes: 320000 }

## Metrics - exact profile settings
metrics:
  enabled: true
  db_path: ./data/metrics-shared.db
  retention_days: 90
  token_tracking: true
  cost_tracking: true
  pricing:
    default_local:
      input: 0
      output: 0

## SIEM - exact profile settings
siem:
  enabled: true
  outputs:
    - type: file
      path: ./logs/audit-shared.jsonl
      rotate_mb: 100

## Classification - exact profile settings
classification:
  enabled: true
  classifier: heuristic
  gate: false

## Identity - exact profile settings
identity:
  enabled: true
  allow_anonymous: false
  require_agent_id: true

## Routing - exact profile 6073417e
routing:
  buckets_enabled: true
  per_agent: {}

## Dashboard - DISABLED for shared profile
dashboard:
  enabled: false

## Discovery - exact profile settings
discovery:
  enabled: true
  refresh_seconds: 3600
  providers:
    nvidia:     { enabled: false }
    openrouter: { enabled: false }
    codex:      { enabled: false }
    zai:        { enabled: false }
    anthropic:  { enabled: false }
