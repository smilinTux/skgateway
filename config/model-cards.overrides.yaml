# ─────────────────────────────────────────────────────────────────────────
# providers: per-PROVIDER trust posture (card N2, design doc section 4.3).
# Sibling of `overrides:` above, not nested under it: this describes WHO
# serves a model, not any one model's card. Consumed by
# src/ranking/capabilities.mjs's `deriveTrustZone()` (opts.providers) to
# fold sovereignty + retention posture into `capabilities.trust_zone`
# (0 sovereign / 1 contractual paid-cloud / 2 exposed free-remote, design
# 5.2). This is card N2's plumbing only: nothing here enforces a zone
# ceiling yet, that hard-filter gate is card N1's job.
#
# Every claim below carries `verified:` (the date someone actually read the
# cited source, not the date this file was committed) and `ref:`. An
# undated retention claim is worthless in six months, per this card's own
# acceptance criteria. When a provider's posture could not be verified this
# session, the honest value is `unknown` with today's date, never a guess.
#
# Per-model override: a model's own `override` entry may carry its own
# `data_retention` key (e.g. a specific paid OpenRouter route with a
# no-log flag) and that wins over the provider default here
# (capabilities.mjs's `resolveProviderPosture()` checks the model first).
# ─────────────────────────────────────────────────────────────────────────
providers:
  # Self-hosted: sovereignty is architectural (data never leaves hardware we
  # own), not a claim against a third party's ToS, so there is nothing to
  # date-verify. Matched by capabilities.mjs's resolveProviderPosture() for
  # any backend name containing "ornith"/"qwen38", or named exactly "local"
  # or "ollama" (all our self-hosted backend keys).
  local:
    data_retention: local-only

  # Verified 2026-08-15 against Anthropic's commercial terms
  # (https://www.anthropic.com/legal/commercial-terms), Section B: "Anthropic
  # may not train models on Customer Content from Services." Reached via the
  # :18782 claude-code-api wrapper (first-party subscription usage, backend
  # key "anthropic") and the api.anthropic.com direct fallback (same
  # account, backend key "anthropic-direct"; capabilities.mjs resolves that
  # key onto this same entry). The commercial-terms page does not itself state a
  # retention WINDOW (it points to a separate DPA for that); the training
  # prohibition is what N1's zone-1 test actually needs, so that is what is
  # asserted here.
  anthropic:
    data_retention: contractual-zero
    verified: "2026-08-15"
    ref: "https://www.anthropic.com/legal/commercial-terms, Section B"

  # Verified 2026-08-15 via https://opencode.ai/docs/zen, which quotes
  # NVIDIA's own free-tier trial banner verbatim: "Trial use only - do not
  # submit personal or confidential data. Your use is logged for security
  # purposes and to improve NVIDIA products and services." That is a
  # training claim from NVIDIA's own UI text, not this session's inference.
  # Applies to the NVIDIA NIM free tier (backend key "nvidia") and to the
  # NVIDIA-origin free models routed through OpenCode Zen (nemotron-*-free),
  # which carry the identical restriction per the same page.
  nvidia:
    data_retention: trains
    verified: "2026-08-15"
    ref: "https://opencode.ai/docs/zen (quoting NVIDIA's NIM free-tier trial banner)"

  # Checked 2026-08-15: OpenRouter's own privacy/logging docs
  # (https://openrouter.ai/docs/features/privacy-and-logging) explicitly
  # decline to state OpenRouter's own retention/training policy for prompts
  # ("This setting has no bearing on OpenRouter's own policies and what we
  # do with your prompts.") and instead point at each ROUTED provider's own
  # policy, which varies per model and changes as OpenRouter adds/drops
  # upstream providers. Recorded `trains` as the fail-safe assumption for
  # the free tier specifically (unauthenticated, zero-cost inference is the
  # least-verifiable arrangement available), not because every routed
  # provider was individually confirmed to train.
  openrouter:
    data_retention: trains
    verified: "2026-08-15"
    ref: "https://openrouter.ai/docs/features/privacy-and-logging (policy varies per routed provider; free tier assumed worst-case)"

  # Verified 2026-08-15 via https://opencode.ai/docs/zen: for the free-tier
  # models during their trial period (Big Pickle, DeepSeek V4 Flash Free,
  # MiMo-V2.5 Free, Hy3 Free, Laguna S 2.1 Free), "collected data may be
  # used to improve the model," and the NVIDIA-origin free models on the
  # same page carry NVIDIA's own logging/training language too (see the
  # `nvidia` entry above). Zen's paid models are zero-retention per the same
  # page; this entry is scoped to what card N2 actually routes today
  # (`discovery: free` in skgateway.yaml, opencode backend), the free tier.
  opencode:
    data_retention: trains
    verified: "2026-08-15"
    ref: "https://opencode.ai/docs/zen (free-tier models: 'collected data may be used to improve the model')"
