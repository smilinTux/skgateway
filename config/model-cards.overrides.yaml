    org: Anthropic
    summary: "Flagship reasoning + agentic-coding model. The heavy-tier brain behind sk-heavy."
    good_at: [deep reasoning, agentic coding, long-context synthesis, tool use, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    quant: "n/a (hosted)"
    speed: "medium; premium quality"
    license: proprietary
    notes: "Pinned to role sk-heavy and the sk-auto hard tier. Costs real money, use the tier ladder to keep it off cheap jobs."

