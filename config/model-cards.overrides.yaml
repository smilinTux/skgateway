# model-cards.overrides.yaml  --  SKWorld Model Dex (curated cards)
#
# Our own hand-curated model cards. Two jobs:
#  1. FEED THE RANKER. Static models (claude, ornith, qwen-vl) and heuristic
#     NVIDIA cards have no provider-declared capabilities, so the capability
#     deriver (src/ranking/capabilities.mjs) reads the machine fields below:
#       context_length          -> capabilities.ctx_tokens
#       supported_parameters    -> capabilities.tool_use (contains "tools")
#       modality / vision       -> capabilities.vision
#  2. BE READABLE (the "dex"). The human fields (display_name, org, summary,
#     good_at, params, quant, speed, tier, license, released, notes) are ignored
#     by the ranker and rendered for people to read through. Keep them accurate
#     and geeky: this is the place to track the latest-and-greatest capabilities.
#
# Precedence (discovery.mjs applyCardOverlay): a live provider card (OpenRouter,
# source:'openrouter') is never clobbered. A heuristic NVIDIA card is enriched.
# A card-LESS static model (claude/ornith) gets a card CREATED from its entry.
# Once overlaid, source becomes 'manual' (Chef-validated, not guessed).
#
# EOL is NOT tracked here: the lifecycle state machine (card P1.1) owns that.
# Do not resurrect a pruned id. Keep the numbers honest; if you are not sure of
# a value, leave it out rather than guessing (a null field beats a wrong one).

overrides:

  # ───────────────────────── OUR CLAUDE FLEET (paid cloud) ────────────────────
  # Reached via the Anthropic backend (OAuth + OpenAI<->Messages translation).
  # All support tools, vision, and extended thinking. Context per the registry
  # 'opus' backend (500K); output caps are conservative practical ceilings.
