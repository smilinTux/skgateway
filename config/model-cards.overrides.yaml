# model-cards.overrides.yaml  --  SKWorld Model Dex (curated cards)
#
# Our own hand-curated model cards. Two jobs:
#  1. FEED THE RANKER. Static models (claude, ornith, qwen-vl) and heuristic
#     NVIDIA cards have no provider-declared capabilities, so the capability
#     deriver (src/ranking/capabilities.mjs) reads the machine fields below:
#       context_length          -> capabilities.ctx_tokens
#       supported_parameters    -> capabilities.tool_use (contains "tools")
#       modality / vision       -> capabilities.vision
#  2. BE READABLE (the "dex"). The human fields (display_name, org, summary,
#     good_at, params, quant, speed, tier, license, released, notes) are ignored
#     by the ranker and rendered for people to read through. Keep them accurate
#     and geeky: this is the place to track the latest-and-greatest capabilities.
#
# Precedence (discovery.mjs applyCardOverlay): a live provider card (OpenRouter,
# source:'openrouter') is never clobbered. A heuristic NVIDIA card is enriched.
# A card-LESS static model (claude/ornith) gets a card CREATED from its entry.
# Once overlaid, source becomes 'manual' (Chef-validated, not guessed).
#
# EOL is NOT tracked here: the lifecycle state machine (card P1.1) owns that.
# Do not resurrect a pruned id. Keep the numbers honest; if you are not sure of
# a value, leave it out rather than guessing (a null field beats a wrong one).
#
# Card N2 (coordination id f942d93b, design doc
# 2026-08-14-model-metadata-risk-job-matching-arch.md): six more machine
# fields, same "leave it out rather than guess" rule.
#   params_b / active_params_b   total / MoE-active parameters in billions.
#                                 For NVIDIA and OpenRouter ids with a size
#                                 token, discovery/providers/{nvidia,
#                                 openrouter}.mjs already derive these
#                                 heuristically at fetch time (see
#                                 discovery/model-size.mjs); an override here
#                                 wins over that guess (applyCardOverlay
#                                 precedence, discovery.mjs:268). For a static
#                                 model (Claude, Ornith, the local vision
#                                 model) there is no heuristic to enrich, so
#                                 the value below IS the whole fact.
#   size_class                   S/M/L/XL, the Joule Economy enum VERBATIM
#                                 (skcapstone docs/superpowers/specs/
#                                 2026-08-14-joule-economy-design.md 3.1/3.3).
#                                 Same precedence: overlay wins over the
#                                 heuristic params_b-based guess.
#   latency_class                interactive|batch. Overlay-only today (no
#                                 metrics.db p50 signal is wired into this
#                                 file; that measured path is card P5.4/A3,
#                                 not this one). Flag a model batch only on
#                                 an observed slow measurement, noted inline.
#   reasoning / structured_outputs   booleans. For a live provider card
#                                 (OpenRouter, models.dev/OpenCode Zen) these
#                                 are now read directly off
#                                 supported_parameters/models.dev's own
#                                 declaration in the adapter itself (card
#                                 building, not this file) and this file
#                                 CANNOT override them: both `source:
#                                 'openrouter'` and `source: 'models.dev'`
#                                 are in discovery.mjs's
#                                 `_FRESH_PROVIDER_SOURCES`, so
#                                 applyCardOverlay skips those ids entirely
#                                 (discovery.mjs:266-273). For a static model
#                                 they are declared below directly.
#   min_output_tokens            lifted from the registry backend blocks
#                                 (~/.skcapstone/models/registry.yaml
#                                 `min_output_tokens:`) that already floor
#                                 this for reasoning models whose <think>
#                                 block can otherwise starve content
#                                 entirely. registry.yaml stays the
#                                 enforcement point for registry-routed
#                                 traffic; this is the same fact made
#                                 readable to the ranker/matcher for
#                                 `@match`-routed traffic (design 6c).
#
# A `providers:` top-level block (sibling of `overrides:`, see the bottom of
# this file) carries per-PROVIDER data_retention posture, each with a dated
# verification, and a separately declared cost_tier. Per-model data_retention
# and cost_tier overrides belong on the model's own entry and win over provider
# defaults. Family is declared per card or assigned by the reviewed broad-family
# map in src/discovery/routing-metadata.mjs. Unmapped live ids are retained with
# family: null and an unfamilied_reason rather than guessed.
#
# Cost and trust are intentionally separate. In particular, free-remote is not
# simply "cheap": provider records verified 2026-08-15 show that the free
# NVIDIA, OpenRouter, and OpenCode routes correlate with trains-on-content.
# deriveTrustZone remains exclusively authoritative for where data may go.

overrides:

  # ───────────────────────── OUR CLAUDE FLEET (paid cloud) ────────────────────
  # Reached via the Anthropic backend (OAuth + OpenAI<->Messages translation).
  # All support tools, vision, and extended thinking. Context per the registry
  # 'opus' backend (500K); output caps are conservative practical ceilings.
  claude-opus-4-8:
    display_name: "Claude Opus 4.8"
    org: Anthropic
    summary: "Flagship reasoning + agentic-coding model. The heavy-tier brain behind sk-heavy."
    good_at: [deep reasoning, agentic coding, long-context synthesis, tool use, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    quant: "n/a (hosted)"
    speed: "medium; premium quality"
    license: proprietary
    # Card N2: size_class curated (params unknown and irrelevant for a
    # hosted static, same call the design's own worked example makes for
    # this exact model, section 4.2). reasoning/structured_outputs already
    # true in supported_parameters above; declared here too as plain
    # booleans so a caller doesn't have to re-scan that array.
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: true
    notes: "Pinned to role sk-heavy and the sk-auto hard tier. Costs real money, use the tier ladder to keep it off cheap jobs."

  # Claude 5 family. Added 2026-08-16 after the claude-code-api wrapper's model
  # discovery was repaired (it had been 401ing since 2026-08-15 by sending the
  # OAuth token as x-api-key, so the wrapper advertised nothing newer than 4.8
  # and sk-l-internal was resolving to claude-opus-4-7).
  #
  # size_class is CURATED, same call and same reasoning as claude-opus-4-8
  # above: parameter counts are unpublished and irrelevant for a hosted static
  # model, so the class is a declared capability floor rather than a derived
  # one. Without an entry here these models arrive with size_class null, clear
  # only floor S, and would be silently ineligible for sk-l-internal and every
  # other bucket above S. Present in the catalog and unusable is worse than
  # absent, because it looks like it works.
  claude-opus-5:
    display_name: "Claude Opus 5"
    org: Anthropic
    summary: "Current flagship reasoning and agentic-coding model. Supersedes Opus 4.8 as the heavy tier."
    good_at: [deep reasoning, agentic coding, long-context synthesis, tool use, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    quant: "n/a (hosted)"
    speed: "medium; premium quality"
    license: proprietary
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: true
    notes: "Current heavy tier. Verified served by the claude-code-api wrapper and api.anthropic.com on 2026-08-16."

  claude-sonnet-5:
    display_name: "Claude Sonnet 5"
    org: Anthropic
    summary: "Current mid tier. Balanced quality and latency; the workhorse above Haiku and below Opus."
    good_at: [coding, tool use, summarisation, structured output, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    quant: "n/a (hosted)"
    speed: "fast; strong quality per second"
    license: proprietary
    # L not XL, mirroring claude-sonnet-4-6. A capability FLOOR of L is what a
    # bucket asks for; calling this XL would let sk-xl-* work land on a mid-tier
    # model purely because the label was generous.
    size_class: L
    latency_class: interactive
    reasoning: true
    structured_outputs: true
    notes: "Current mid tier. Verified served by the claude-code-api wrapper and api.anthropic.com on 2026-08-16."

  claude-opus-4-7:
    display_name: "Claude Opus 4.7"
    org: Anthropic
    summary: "Previous Opus generation. Strong reasoning; kept as a fallback / comparison point."
    good_at: [deep reasoning, coding, tool use, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: true

  claude-sonnet-4-6:
    display_name: "Claude Sonnet 4.6"
    org: Anthropic
    summary: "Balanced speed/quality workhorse. Great default for agentic coding when Opus is overkill."
    good_at: [coding, tool use, everyday reasoning, vision]
    context_length: 500000
    max_output_tokens: 64000
    supported_parameters: [tools, tool_choice, structured_outputs, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    speed: "fast"
    # Card N2: curated below XL, not because Sonnet is weak, but because
    # Opus already holds the sk-heavy XL slot and a job matcher choosing
    # between the two on `min_class` alone should prefer Opus for a
    # class-XL requirement. A judgment call, not a params-derived number
    # (Claude discloses no parameter count).
    size_class: L
    latency_class: interactive
    reasoning: true
    structured_outputs: true

  claude-haiku-4-5:
    display_name: "Claude Haiku 4.5"
    org: Anthropic
    summary: "Fastest, cheapest Claude. Good for high-volume, latency-sensitive tool use."
    good_at: [fast tool use, classification, short tasks, vision]
    context_length: 200000
    max_output_tokens: 32000
    supported_parameters: [tools, tool_choice, structured_outputs]
    modality: "text+image->text"
    tier: paid-cloud
    speed: "very fast"
    # Card N2: fastest/cheapest Claude, curated M (not the XL/L Opus/Sonnet
    # get): Haiku's own supported_parameters above never declared
    # `reasoning`, so that boolean stays false/omitted here too, honest with
    # the card's own declaration rather than assumed from the family name.
    size_class: M
    latency_class: interactive
    structured_outputs: true

  # ──────────────── OPENAI CODEX FLEET (ChatGPT subscription, paid cloud) ───────
  # Reached via the codex backend (chatgpt.com/backend-api/codex, OpenAI
  # Responses API, auth_type codex_oauth against a synced Codex CLI auth.json;
  # see src/proxy/codex-adapter.mjs). First-party SUBSCRIPTION usage: inference
  # draws down a ChatGPT plan quota (Pro / ProLite), never a per-token API bill.
  # Catalog facts (context 272K, reasoning levels, input modalities) are the
  # backend's own /models declaration via the codex discovery provider; these
  # entries add the curated fields that provider cannot declare.
  #
  # size_class is CURATED on capability-floor evidence, same call as the Claude
  # entries above: parameter counts are unpublished, so the class follows the
  # provider's own priority ordering (its /models `priority` field: sol 1,
  # terra 2, luna 3, gpt-5.5 7, gpt-5.4 16, gpt-5.4-mini 23) plus frontier
  # family membership. Without an entry here a discovered codex model arrives
  # with size_class null, clears only floor S, and is silently ineligible for
  # every bucket above S.
  #
  # TRUST: ChatGPT consumer-plan terms are NOT contractual-zero retention
  # (training can be excluded per-account with data controls, but the default
  # posture is not a zero-retention contract like Anthropic's commercial terms).
  # The providers.codex entry below therefore records `trains`, which derives
  # trust zone 2: codex models join sk-*-public buckets only, never internal
  # or secret. That is the honest boundary for a consumer subscription and it
  # matches the fleet rule that protected matter content never leaves the local
  # stack through this route.
  gpt-5.6-sol:
    display_name: "GPT-5.6 Sol"
    org: OpenAI
    summary: "Subscription frontier agentic-coding model. Top of the Codex catalog."
    good_at: [agentic coding, tool use, long-context synthesis, reasoning]
    context_length: 272000
    max_output_tokens: null
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    speed: "fast; priority service tier available (1.5x, higher quota draw)"
    license: proprietary
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: false
    notes: "Efforts low..ultra. Unsupported by the backend (400): temperature, stop, max_output_tokens; the codex-adapter drops them. Priority order 1 of 8 in the provider catalog."

  gpt-5.6-terra:
    display_name: "GPT-5.6 Terra"
    org: OpenAI
    summary: "Second-priority GPT-5.6 variant on the Codex subscription."
    good_at: [agentic coding, tool use, reasoning]
    context_length: 272000
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: false
    notes: "Priority order 2 of 8 in the provider catalog. Same wire contract as gpt-5.6-sol."

  gpt-5.6-luna:
    display_name: "GPT-5.6 Luna"
    org: OpenAI
    summary: "Third GPT-5.6 variant, lighter reasoning ladder (no ultra effort)."
    good_at: [coding, tool use, everyday reasoning]
    context_length: 272000
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    size_class: L
    latency_class: interactive
    reasoning: true
    structured_outputs: false
    notes: "Priority order 3 of 8. Curated L, not XL: no ultra effort tier declared."

  gpt-5.5:
    display_name: "GPT-5.5"
    org: OpenAI
    summary: "Previous-generation frontier on the Codex subscription."
    good_at: [coding, tool use, general reasoning]
    context_length: 272000
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    size_class: XL
    latency_class: interactive
    reasoning: true
    structured_outputs: false
    notes: "Priority order 7 of 8."

  gpt-5.4:
    display_name: "GPT-5.4"
    org: OpenAI
    summary: "Mature GPT-5.4 tier on the Codex subscription."
    good_at: [coding, tool use]
    context_length: 272000
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text+image->text"
    tier: paid-cloud
    size_class: L
    latency_class: interactive
    reasoning: true
