  # ───────────────────────── Z.AI CODING PLAN (paid cloud) ────────────────────
  # Model ids are discovered from ZCode's current /models entitlement list.
  # Only the paid-cloud tier is asserted here. ZCode's entitlement response
  # does not publish context, parameter count, or tool capability facts, so
  # those fields remain absent until independently verified. This prevents an
  # attractive but unsupported size claim from placing a model in an XL bucket.
  glm-4.5:       { display_name: "GLM-4.5",       org: Z.ai, tier: paid-cloud }
  glm-4.5-air:   { display_name: "GLM-4.5 Air",   org: Z.ai, tier: paid-cloud }
  glm-4.6:       { display_name: "GLM-4.6",       org: Z.ai, tier: paid-cloud }
  glm-4.7:       { display_name: "GLM-4.7",       org: Z.ai, tier: paid-cloud }
  glm-5:         { display_name: "GLM-5",         org: Z.ai, tier: paid-cloud }
  glm-5-turbo:   { display_name: "GLM-5 Turbo",   org: Z.ai, tier: paid-cloud }
  glm-5.1:       { display_name: "GLM-5.1",       org: Z.ai, tier: paid-cloud }
  glm-5.2:       { display_name: "GLM-5.2",       org: Z.ai, tier: paid-cloud }
  glm-5.3:       { display_name: "GLM-5.3",       org: Z.ai, tier: paid-cloud }

  # ──────────────────────── OUR ORNITH FLEET (local, sovereign) ───────────────
  # DeepReinforce Ornith 1.0, self-hosted on our own GPUs. Cloud-free, private.
  # Tool use PROVEN end-to-end through the gateway (Bash tool round-trip, after
  # the streaming content_block_start fix 9e23c62). Reasoning models: they emit
  # <think> before content, so keep an 8192 output floor (registry does this).
  ornith-1.0-35b:
    display_name: "Ornith 1.0 35B"
    org: DeepReinforce (self-hosted)
    summary: "Our sovereign 35B reasoning model on chiap08. The cloud-free brain behind sk-default."
    good_at: [reasoning, coding, tool use, sovereign/private work]
    context_length: 131072
    max_output_tokens: 32768
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text->text"
    params: "35B dense"
    quant: "Q4_K_M / NVFP4 (aeon)"
    tier: local
    speed: "medium (~1-3s warm); NVFP4 aeon variant is the current default"
    license: open-weights
    # Card N2: size_class L / min_output_tokens 8192 match the spec's own
    # worked overlay example (design doc 4.2) for this exact model.
    # min_output_tokens lifted from registry.yaml backends.ornith-big /
    # backends.ornith (both 8192): the reasoning model spends completion
    # tokens on <think> before content, so a small client max_tokens returns
    # empty content with finish_reason=stop (measured, same note as below).
    params_b: 35
    size_class: L
    latency_class: interactive
    reasoning: true
    min_output_tokens: 8192
    notes: "Registry role sk-default -> ornith-big -> ornith-1.0-35b-aeon-nvfp4 on chiap08 :11436. Reasoning model: needs max_tokens >= 2048 (8192 floor) or content starves under <think>."

  ornith-big:
    display_name: "Ornith 1.0 35B (role alias)"
    org: DeepReinforce (self-hosted)
    summary: "Registry alias for the 35B, routed across chiap08 (primary) + standby with 5xx failover."
    good_at: [reasoning, coding, tool use, sovereign/private work]
    context_length: 131072
    max_output_tokens: 32768
    supported_parameters: [tools, tool_choice, reasoning]
    modality: "text->text"
    tier: local
    params_b: 35
    size_class: L
    latency_class: interactive
    reasoning: true
    min_output_tokens: 8192

  ornith-1.0-9b:
    display_name: "Ornith 1.0 9B (ornith-tiny)"
    org: DeepReinforce (self-hosted)
    summary: "The small, fast sovereign reasoner on the .100 5060 Ti. NVFP4 + MTP. Pairs with the 35B."
