siem:
  enabled: true
  outputs:
    - type: file
      path: ./logs/audit.jsonl
      rotate_mb: 100

## Capability-aware routing master gate (design doc 2026-08-08, cards
## P4.1-P4.4). Governs BOTH the registry `@match` role ranking branch
## (rankModels() picks a candidate chain for roles targeting "@match" in
## ~/.skcapstone/models/registry.yaml) and the per-request `x-sk-require`
## header escape hatch. Default OFF (commented, matching code default in
## src/config.mjs): with it off the hot path is byte-identical to before
## those cards existed, no rank call, no new candidates, no added latency.
## The Phase 3 suggest-only GET /admin/models/rank API (loopback) is the
## soak period, observe rankings there before flipping this on.
# routing:
#   match_enabled: true

dashboard:
  enabled: true
  refresh_ms: 5000

## Dynamic provider model discovery: periodically polls each declared
## backend's model-list endpoint and folds newly seen models into the
## effective model set, instead of relying solely on the static `models`
## arrays above.
discovery:
  enabled: true
  refresh_seconds: 3600
  providers:
    anthropic:  { enabled: true, free_only: false, chat_only: true }
    nvidia:     { enabled: true, free_only: true, chat_only: true }
    openrouter: { enabled: true, free_only: true, chat_only: true }
