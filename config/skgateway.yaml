## SKGateway configuration
## All fields have code-level defaults; this file only needs entries that differ.
## Reload at runtime: kill -HUP <pid>  or  pkill -HUP skgateway

server:
  port: 18780
  dashboard_port: 18781
  bind: 0.0.0.0

## Advertised-vs-working reconciliation (card 5c680ee9)
## The GET /v1/models catalog is reconciled against live backend health so
## callers are not offered models whose only backend(s) are down or quarantined.
## Composes with the quarantine layer via Backend.isAvailable(); recovery
## re-admits a model automatically. Runtime view only, config is never mutated.
##   reconcile: flag  (default) advertise all, annotate status available/unavailable
##              hide           omit models with no available serving backend
##              off            legacy behavior, advertise everything, no status
## 2026-08-14: ENABLED as `hide`. It shipped commented out, so the effective
## default was `flag` and the catalog advertised models whose only backend was
## down. Live example: `ornith-1.0-35b` was still offered while chiap08:11436 is
## connection-refused (ornith-aeon.service inactive).
##
## Measured after the flip: a freshly restarted gateway serves 26 models, and
## the same gateway serves 16 once three real requests have failed. The signal
## is REACTIVE (Backend.isAvailable() starts optimistic), so the catalog is at
## its least accurate right after a restart. Card 767adc4e.
##
## SCOPE: this reconciles BACKEND health/quarantine only. A retired model on a
## HEALTHY backend is still advertised, which is most of the current rot (11 of
## 12 NVIDIA ids answer 410 Gone or 404 while the nvidia backend is fine).
advertise:
  reconcile: hide
  # Card db431f61: measured fast-dead on 2026-08-25. Keep these ids out of
  # every catalog and bucket projection until the exact backend is restored
  # and separately qualified by model-list plus completion. This does not
  # enable bucket addressing.
  excluded_models:
    - ornith-1.5-9b
    - ornith-1.0-35b
    - ornith-big
    - ornith-1.0-9b

## Connection Pooling — enforces per-backend concurrency limits
## NVIDIA NIM allows 20 concurrent requests max. We enforce this here
## so the gateway never exceeds the upstream limit.
pooling:
  default_max_concurrent: 20    # Max concurrent requests per backend
  default_max_queue: 1000        # Max queue depth per backend
  queue_timeout_ms: 300000        # Max time a request waits in queue (5 min)
  # Each physical Qwen3.8 replica has an independent admission domain. Registry
  # traffic currently materializes through chiap08-qwen38 and consumes that
  # host's domain. Request aliases identify one canonical model, not capacity.
  capacity_domains:
    chiap08-qwen38:
      members: [chiap08-qwen38, "reg:qwen38"]
      max: 2
      maxQueue: 2
      queueTimeoutMs: 10000
    chiap01-qwen38:
      members: [chiap01-qwen38]
      max: 1
      maxQueue: 1
      queueTimeoutMs: 10000
  per_backend:                   # Per-backend overrides
    nvidia:
      max: 20                     # NVIDIA NIM: 20 concurrent
      maxQueue: 500               # Queue up to 500 requests for NVIDIA
    # The old `ollama` override (max 50) was removed 2026-09-04 with the
    # backend rename to `ornith`. Config validation rejects a per_backend key
    # for a disabled backend, so when `ornith` is re-enabled add
    #   ornith: { max: 4, maxQueue: 200 }
    # here (llama-server on the .100 16 GB card; keep admission small).
    anthropic:
      max: 10                     # Anthropic API limit
      maxQueue: 200

backends:
  # Card db431f61 purged the dead .100 Ornith listener and chiap08 :11436
  # claim. Reintroduction requires a separate change with exact model-list and
  # completion qualification for every declared id.

  ## Qwen3.8 27B Huihui abliterated Q4_K_M canonical model. chiap01 B70 card 1
  ## is an independent replica at :18810. It claims only the exact model id
  ## reported by its upstream.
  ## Confirmed live 2026-09-04 (card 0e010200): GET /v1/models reports exactly
  ## qwen3.8-27b-huihui-abliterated-q4_k_m (owned_by llamacpp, n_ctx 32768) and
  ## a real chat completion returned 200 with that model id.
  chiap01-qwen38:
    url: http://chiap01:18810/v1
    auth_type: none
    models:
      - qwen3.8-27b-huihui-abliterated-q4_k_m
    context_limit: 32768
    priority: 3

  ## The chiap08 replica is vLLM with a 131072-token context. Its model list
  ## exactly matches the ids reported by the upstream.
  ##
  ## 2026-08-14: added as the then-current sk-default target. `ornith-aeon.service` on chiap08
  ## (the 35B behind :11436) is inactive/dead, so :11436 is connection-REFUSED and
  ## every ornith-1.0-35b request 502s. sk-default resolved to ornith-big -> that
  ## dead port -> the cloud local_fallback, where it intermittently landed on a
  ## RETIRED NVIDIA model and returned 404. That is what failed skoperator every
  ## 15 minutes. This backend is live and verified (chat 200, content non-empty).
  ##
  ## Reasoning model: it spends completion tokens on reasoning_content before
  ## emitting content, so a low max_tokens returns an EMPTY string with
  ## finish_reason=stop. Observed: 121 completion tokens to answer "say alive".
  ## The registry entry carries min_output_tokens: 8192 for exactly this reason.
  ##
  ## 2026-09-04 (card 0e010200): the url was the literal, never-substituted
  ## placeholder `http://TAILNET_HOST:11439/v1` left by the publication scrub
  ## (#53), so this block was dead as written. `chiap08` is the bare MagicDNS
  ## host name; #53 deliberately KEEPS real host names and strips only the
  ## tailnet address, so the name is publication-safe and it is what resolves.
  ## Probed live before this edit: GET http://chiap08:11439/v1/models reports
  ## qwen3.8-27b-huihui-abliterated-q4_k_m (owned_by vllm, max_model_len 131072).
  chiap08-qwen38:
    url: http://chiap08:11439/v1
    auth_type: none
    models:
      - qwen3.8-27b-huihui-abliterated-q4_k_m
      - qwen3.8-chiap08
      - qwen3.8-vllm
    context_limit: 131072
    priority: 3
  nvidia:
    url: https://integrate.api.nvidia.com/v1
    auth_type: api_key
    api_key_env: NVIDIA_API_KEY
    models:
      ## Validated live 2026-07-15 via one-word completion probe. Dead and
      ## decommissioned models pruned (see note at end of list).
      ## Qwen
      - qwen/qwen3.5-122b-a10b
      - qwen/qwen3.5-397b-a17b
      ## OpenAI OSS
      - openai/gpt-oss-20b
      ## DeepSeek
      - deepseek-ai/deepseek-v4-flash
      - deepseek-ai/deepseek-v4-pro                    # slow (~46s), batch/cron use
      ## Mistral
      - mistralai/mistral-medium-3.5-128b
      - mistralai/mistral-large-3-675b-instruct-2512
      ## NVIDIA
      - nvidia/llama-3.3-nemotron-super-49b-v1.5
      ## MiniMax
      - minimaxai/minimax-m2.7                         # slow (~40s), batch/cron use
      ## PRUNED 2026-07-15 (validated dead, all failed a warm one-word probe):
      ##   moonshotai/kimi-k2.6                    404 Function not found (account)
      ##   qwen/qwen3-next-80b-a3b-instruct        hang > 60s
      ##   qwen/qwen3-next-80b-a3b-thinking        410 Gone (decommissioned)
      ##   qwen/qwen3-coder-480b-a35b-instruct     410 Gone (decommissioned)
      ##   openai/gpt-oss-120b                     hang > 60s
      ##   meta/llama-3.3-70b-instruct             hang > 60s
      ##   google/gemma-4-31b-it                   hang > 90s
      ##   bytedance/seed-oss-36b-instruct         hang > 90s
      ##   mistralai/ministral-14b-instruct-2512   hang > 60s
    priority: 1

  anthropic:
    # Route Claude models through the LOCAL Claude Code client wrapper
    # (claude-code-api :18782 = `claude --print`) so they bill as genuine
    # FIRST-PARTY subscription usage. Hitting api.anthropic.com directly with the
    # raw OAuth token is treated by Anthropic as a third-party app that draws from
    # extra-usage (not the plan), which starves the subscription and 400s under
    # load. The wrapper IS Claude Code, so it uses the plan correctly.
    # OpenAI-compatible wrapper; the shared secret is supplied from the
    # service EnvironmentFile and never committed.
    url: http://127.0.0.1:18782/v1
    auth_type: api_key
    api_key_env: CCAPI_TOKEN
    discovery: anthropic
    models: &claude_cold_start_models
      - claude-fable-5
      - claude-haiku-4-5
      - claude-haiku-4-5-20251001
      - claude-opus-4-5-20251101
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-opus-5
      - claude-sonnet-4-5-20250929
      - claude-sonnet-4-6
      - claude-sonnet-5
    priority: 2
    # SPOF fail-fast: the wrapper is a single local service outside this repo.
    # If it wedges (accepts the socket but never replies) the request would hang
    # forever with no failover. This idle timeout aborts a stalled wrapper call
    # with a 504 rather than hanging. There is NO failover target by design:
    # the subscription path is the only claude-* route. Generous
    # enough for a real `claude --print` completion; a live stream resets it on
    # each chunk, so only a truly stalled upstream trips it.
    timeout_ms: 120000

  ## ornith = Ornith 1.5 9B on the .100 RTX 5060 Ti (llama-server :8082,
  ## name-agnostic OpenAI /v1; the same box the registry `ornith` entry and
  ## the `reg:ornith` synthetic route point at). This block REPLACES the old
  ## `ollama` backend (.100:11434, glob `dolphin-*`): that listener had been
  ## dead for about two days, no dolphin model has ever been requested through
  ## this gateway (audit log: zero hits), and .100 is the ornith host, so the
  ## backend is now named for what it serves.
  ##
  ## DISABLED 2026-09-04 (card 0e010200) because the host did not answer.
  ## Probed live from the gateway node before this edit:
  ##   ping 192.168.0.100                         2/2 replies
  ##   tcp 22 and 11434                           open, but the SSH banner
  ##                                              exchange times out and an HTTP
  ##                                              GET on :11434 returns 0 bytes
  ##                                              in 15 s
  ##   GET http://192.168.0.100:8082/v1/models    connect timed out after 15 s
  ##   GET http://192.168.0.100:11438/v1/models   no answer
  ##   tailscale status (skworld-100)             offline, last seen 2 days ago
  ## The kernel answers and every service on it is wedged. The gateway journal
  ## shows this same :8082 endpoint 502ing after 132 s and being QUARANTINED
  ## at 04:37 the same morning. A declared-but-dead backend is exactly the
  ## defect this card removes (a retired NVIDIA id left in config broke the
  ## operator every run), so the block is kept complete and switched OFF.
  ## To re-enable: verify GET /v1/models AND a real completion on :8082, then
  ## flip `enabled: true`. There is no discovery provider for this backend, so
  ## `enabled` here is the only flag; `models` stays non-empty on purpose so
  ## Backend.matches() can never fall into its empty-list accept-everything
  ## behaviour.
  ornith:
    enabled: false
    url: http://192.168.0.100:8082/v1
    auth_type: none
    models:
      - ornith-1.5-9b
    priority: 3

  openrouter:
    enabled: false
    url: https://openrouter.ai/api/v1
    auth_type: api_key
    api_key_env: OPENROUTER_API_KEY
    discovery: free
    max_concurrent: 10

tools:
  guaranteed:
    - exec
    - read
    - write
    - edit
    - message
  max_budget: 16
  fallback_budget: 8
  call_limit: 10

# Streaming → non-streaming auto-flip.  Tool-heavy or large-context turns
# hit NVIDIA NIM streaming instability (connection drops mid-stream at ~10k
# tokens).  When any trigger below matches, the proxy forces `stream:false`
# upstream, buffers the complete JSON, and re-emits SSE to the client so
# the streaming contract is preserved without the mid-stream-drop failure
# mode.  Tool requests already non-stream upstream (see core.mjs); this
# covers non-tool traffic and explicit opt-in.
streaming:
  default: true
  force_header: x-skgateway-nonstream        # value 'force' or '1'
  auto_nonstream:
    enabled: true
    trigger_if_body_bytes_ge: 40000          # ~10k tokens
    trigger_if_messages_ge: 6
    trigger_if_tool_call_history_ge: 3
    aggressive_models:
      - moonshotai/kimi-k2.6
      - qwen/qwen3-next-80b-a3b-instruct
      - qwen/qwen3-next-80b-a3b-thinking
      - deepseek-ai/deepseek-v4-flash
      - deepseek-ai/deepseek-v4-pro

sanitizer:
  max_system_bytes: 40000       # global default — ~10K tokens
  max_body_bytes: 120000        # global default — ~30K tokens
  keep_start: 2
  keep_end: 12
  strip_thinking: true

# Per-model context limits.  Formula: max_body_bytes = context_tokens * 4 bytes * 0.80
# max_system_bytes = max_body_bytes * 0.40.  Values from NVIDIA NIM model cards (2026-05-12).
model_limits:
  ## 256K context (Huihui Qwen3.8 27B on chiap08 :11439, CTX_SIZE=262144) —
  ## the exact served id and all compatibility aliases carry the same limits.
  qwen3.8-27b-huihui-abliterated-q4_k_m:      { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-chiap08:                            { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-vllm:                               { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-27b-ud-q5_k_xl:                     { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-27b:                                { max_body_bytes: 800000,   max_system_bytes: 320000  }  # short alias of the Huihui served id
  qwen38-abliterated:                         { max_body_bytes: 800000,   max_system_bytes: 320000  }
  ## 256K context (kimi-k2.6)
  moonshotai/kimi-k2.6:                       { max_body_bytes: 800000,   max_system_bytes: 320000  }
  ## 262K context (Qwen3 family, Mistral family, Gemma 4)
  qwen/qwen3-next-80b-a3b-instruct:           { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3-next-80b-a3b-thinking:           { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3-coder-480b-a35b-instruct:        { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3.5-122b-a10b:                     { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3.5-397b-a17b:                     { max_body_bytes: 838000,   max_system_bytes: 335000  }
  mistralai/mistral-medium-3.5-128b:          { max_body_bytes: 838000,   max_system_bytes: 335000  }
  mistralai/mistral-large-3-675b-instruct-2512: { max_body_bytes: 838000, max_system_bytes: 335000  }
  mistralai/ministral-14b-instruct-2512:      { max_body_bytes: 838000,   max_system_bytes: 335000  }
  google/gemma-4-31b-it:                      { max_body_bytes: 838000,   max_system_bytes: 335000  }
  ## 1M context (DeepSeek V4 — cap at 2M bytes practical limit)
  deepseek-ai/deepseek-v4-flash:              { max_body_bytes: 2000000,  max_system_bytes: 800000  }
  deepseek-ai/deepseek-v4-pro:               { max_body_bytes: 2000000,  max_system_bytes: 800000  }
  ## 512K context (ByteDance Seed OSS)
  bytedance/seed-oss-36b-instruct:            { max_body_bytes: 1638000,  max_system_bytes: 655000  }
  ## 204K context (MiniMax M2.7)
  minimaxai/minimax-m2.7:                     { max_body_bytes: 655000,   max_system_bytes: 262000  }
  ## 128K context (GPT-OSS, Llama 3.3)
  openai/gpt-oss-120b:                        { max_body_bytes: 409000,   max_system_bytes: 164000  }
  openai/gpt-oss-20b:                         { max_body_bytes: 409000,   max_system_bytes: 164000  }
  meta/llama-3.3-70b-instruct:               { max_body_bytes: 409000,   max_system_bytes: 164000  }
  ## 131K context (Nemotron Super 49B)
  nvidia/llama-3.3-nemotron-super-49b-v1.5:  { max_body_bytes: 419000,   max_system_bytes: 168000  }

metrics:
  enabled: true
  db_path: ./data/metrics.db
  retention_days: 90
  token_tracking: true
  cost_tracking: true

  ## Per-model pricing (USD per 1 000 000 tokens)
  pricing:
    claude-opus-4-7:
      input: 15.00
      output: 75.00
      cache_read: 1.50
      cache_write: 3.75
    claude-sonnet-4-6:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 0.375
    claude-haiku-4-5:
      input: 0.80
      output: 4.00
      cache_read: 0.08
      cache_write: 0.10
    ## NVIDIA hosted models — free tier
    moonshotai/kimi-k2.6:
      input: 0
      output: 0
    qwen/qwen3-next-80b-a3b-instruct:
      input: 0
      output: 0
    qwen/qwen3-coder-480b-a35b-instruct:
      input: 0
      output: 0
    openai/gpt-oss-120b:
      input: 0
      output: 0
    deepseek-ai/deepseek-v4-flash:
      input: 0
      output: 0
    deepseek-ai/deepseek-v4-pro:
      input: 0
      output: 0
    minimaxai/minimax-m2.7:
      input: 0
      output: 0
    ## Ollama local
    default_local:
      input: 0
      output: 0

siem:
  enabled: true
  outputs:
    - type: file
      path: ./logs/audit.jsonl
      rotate_mb: 100

## Capability-aware routing master gate (design doc 2026-08-08, cards
## P4.1-P4.4). Governs BOTH the registry `@match` role ranking branch
## (rankModels() picks a candidate chain for roles targeting "@match" in
## ~/.skcapstone/models/registry.yaml) and the per-request `x-sk-require`
## header escape hatch. Default OFF (commented, matching code default in
## src/config.mjs): with it off the hot path is byte-identical to before
## those cards existed, no rank call, no new candidates, no added latency.
## The Phase 3 suggest-only GET /admin/models/rank API (loopback) is the
## soak period, observe rankings there before flipping this on.
# routing:
#   match_enabled: true

dashboard:
  enabled: true
  refresh_ms: 5000

## Dynamic provider model discovery: periodically polls each declared
## backend's model-list endpoint and folds newly seen models into the
## effective model set, instead of relying solely on the static `models`
## arrays above.
discovery:
  enabled: true
  refresh_seconds: 3600
  providers:
    anthropic:  { enabled: true, free_only: false, chat_only: true }
    nvidia:     { enabled: true, free_only: true, chat_only: true }
    openrouter: { enabled: false, free_only: true, chat_only: true }

## Semantic cache (card: semantic-cache stage 2).
## SHADOW MODE: embeds each eligible prompt, records whether a cached answer
## WOULD have matched, then throws that away and dispatches normally. It never
## serves a cached response to a client while mode is `shadow`.
##
## Off by default. The hit rate on this fleet has never been measured: the
## gateway logs no prompt text and no prompt hash, so there is no way to
## compute it retroactively. Run shadow for a week, read
## `semantic_cache.shadow` events out of the SIEM sink, then decide.
##
## Eligible categories are deliberately narrow. Measured over 10,755 classified
## prompts: tool_use is 49.0% of wall clock but has side effects, conversation
## is memory-grounded, code_generation produces novel output. What is left is
## 26.9% of wall clock, about 2.4 hours per week.
semantic_cache:
  enabled: false
  mode: shadow
  threshold: 0.92
  ttl_seconds: 3600
  max_entries: 2000
  embed_url: http://192.168.0.100:11438/v1/embeddings
  embed_model: mxbai-embed-large
  embed_timeout_ms: 5000
  categories: [administrative, system, data_query]
