## SKGateway configuration
## All fields have code-level defaults; this file only needs entries that differ.
## Reload at runtime: kill -HUP <pid>  or  pkill -HUP skgateway

server:
  port: 18780
  dashboard_port: 18781
  bind: 0.0.0.0

## Advertised-vs-working reconciliation (card 5c680ee9)
## The GET /v1/models catalog is reconciled against live backend health so
## callers are not offered models whose only backend(s) are down or quarantined.
## Composes with the quarantine layer via Backend.isAvailable(); recovery
## re-admits a model automatically. Runtime view only, config is never mutated.
##   reconcile: flag  (default) advertise all, annotate status available/unavailable
##              hide           omit models with no available serving backend
##              off            legacy behavior, advertise everything, no status
## 2026-08-14: ENABLED as `hide`. It shipped commented out, so the effective
## default was `flag` and the catalog advertised models whose only backend was
## down. Live example: `ornith-1.0-35b` was still offered while chiap08:11436 is
## connection-refused (ornith-aeon.service inactive).
##
## Measured after the flip: a freshly restarted gateway serves 26 models, and
## the same gateway serves 16 once three real requests have failed. The signal
## is REACTIVE (Backend.isAvailable() starts optimistic), so the catalog is at
## its least accurate right after a restart. Card 767adc4e.
##
## SCOPE: this reconciles BACKEND health/quarantine only. A retired model on a
## HEALTHY backend is still advertised, which is most of the current rot (11 of
## 12 NVIDIA ids answer 410 Gone or 404 while the nvidia backend is fine).
advertise:
  reconcile: hide

## Connection Pooling — enforces per-backend concurrency limits
## NVIDIA NIM allows 20 concurrent requests max. We enforce this here
## so the gateway never exceeds the upstream limit.
pooling:
  default_max_concurrent: 20    # Max concurrent requests per backend
  default_max_queue: 1000        # Max queue depth per backend
  queue_timeout_ms: 300000        # Max time a request waits in queue (5 min)
  # A capacity domain joins every logical route to one physical service. The
  # direct aliases below route as chiap08-qwen38, while sk-creative/sk-vision
  # materialize as reg:qwen38; both consume the same four llama.cpp slots.
  capacity_domains:
    chiap08-qwen38:
      members: [chiap08-qwen38, "reg:qwen38"]
      max: 4
      maxQueue: 4
      queueTimeoutMs: 30000       # Return retryable 503 before 60s clients give up
  per_backend:                   # Per-backend overrides
    nvidia:
      max: 20                     # NVIDIA NIM: 20 concurrent
      maxQueue: 500               # Queue up to 500 requests for NVIDIA
    ollama:
      max: 50                     # Ollama local: more lenient
      maxQueue: 200
    anthropic:
      max: 10                     # Anthropic API limit
      maxQueue: 200

backends:
  local:
    url: http://192.168.0.100:8082/v1
    auth_type: none
    models:
      - ornith-1.5-9b            # exact llama-server alias on .100:8082
    priority: 1

  ## ornith-1.0-35b (Q4_K_M) — llama.cpp (llama-server :11436, sm120) on chiap08,
  ## 256K ctx, reasoning model. High priority NUMBER keeps this OUT of the
  ## unmatched-model fallback pool (fronted by priority 1); it remains the SOLE
  ## match for the exact id `ornith-1.0-35b`, so it never shadows other routing.
  ##
  ## 2026-07-21: chiap08 added as PRIMARY. chiap08:11436 serves
  ## deepreinforce-ai_Ornith-1.0-35B-Q4_K_M.gguf at n_ctx=262144, so the existing
  ## model_limits (800000/320000) apply unchanged.
  ##
  ## 2026-08-05: REMOVED the two Tyler failover backends (tyler-ornith .150:8087,
  ## tyler-ornith-b .153:8087). Both have been EHOSTUNREACH since 2026-07-21 and
  ## were the ONLY failover targets, so a transient chiap08 5xx failed over to two
  ## dead boxes -> a hard request failure, and the router marked chiap08 DEGRADED
  ## on the resulting error-rate blip (the observed "flakiness"). chiap08 is
  ## verified healthy (plain + concurrent + 39KB tool-laden payloads all 200), so
  ## it is now the SOLE ornith-1.0-35b backend and a blip retries it instead of
  ## cascading to nothing. Re-add the Tyler boxes (priority 5/6) if they return.
  chiap08-ornith:
    url: http://100.81.238.58:11436/v1
    auth_type: none
    models:
      - ornith-1.0-35b
      - ornith-big            # short alias -> same backend (llama.cpp serves name-agnostically)
    priority: 4
  ## Qwen3.8 27B Huihui abliterated Q4_K_M — llama.cpp (llama-server :11439)
  ## on chiap08, 262144 ctx, reasoning model, VISION-capable (mmproj is loaded
  ## by ~skuser01/bin/launch-chiap08-llama-qwen38.sh, unit
  ## `llama-qwen38.service`). The server reports the full Huihui id below; the
  ## other three ids are retained request aliases for the same loaded weights.
  ##
  ## 2026-08-14: added as the then-current sk-default target. `ornith-aeon.service` on chiap08
  ## (the 35B behind :11436) is inactive/dead, so :11436 is connection-REFUSED and
  ## every ornith-1.0-35b request 502s. sk-default resolved to ornith-big -> that
  ## dead port -> the cloud local_fallback, where it intermittently landed on a
  ## RETIRED NVIDIA model and returned 404. That is what failed skoperator every
  ## 15 minutes. This backend is live and verified (chat 200, content non-empty).
  ##
  ## Reasoning model: it spends completion tokens on reasoning_content before
  ## emitting content, so a low max_tokens returns an EMPTY string with
  ## finish_reason=stop. Observed: 121 completion tokens to answer "say alive".
  ## The registry entry carries min_output_tokens: 8192 for exactly this reason.
  chiap08-qwen38:
    url: http://100.81.238.58:11439/v1
    auth_type: none
    models:
      - qwen3.8-27b-huihui-abliterated-q4_k_m   # exact llama-server --alias / served id
      - qwen3.8-27b-ud-q5_k_xl   # retained pre-cutover request alias; serves Huihui Q4_K_M
      - qwen3.8-27b              # short alias -> same backend (llama.cpp is name-agnostic)
      # 2026-08-18 (incident inc-2026-08-18-qwen38-eol): custom alias re-added
      # after the discovery fix. Declaring it here is what the discovery fix
      # trusts: a claimer's declaration beats an unattributed EOL verdict
      # (router gate + advertised catalog) and 404/410s from non-claiming
      # backends no longer count toward its lifecycle (recordModelOutcome
      # claimer-awareness). llama.cpp serves name-agnostically, so the alias
      # is as good as the canonical id on this backend.
      - qwen38-abliterated       # custom alias -> same backend (llama.cpp is name-agnostic)
    priority: 3
  nvidia:
    url: https://integrate.api.nvidia.com/v1
    auth_type: api_key
    api_key_env: NVIDIA_API_KEY
    models:
      ## Validated live 2026-07-15 via one-word completion probe. Dead and
      ## decommissioned models pruned (see note at end of list).
      ## Qwen
      - qwen/qwen3.5-122b-a10b
      - qwen/qwen3.5-397b-a17b
      ## OpenAI OSS
      - openai/gpt-oss-20b
      ## DeepSeek
      - deepseek-ai/deepseek-v4-flash
      - deepseek-ai/deepseek-v4-pro                    # slow (~46s), batch/cron use
      ## Mistral
      - mistralai/mistral-medium-3.5-128b
      - mistralai/mistral-large-3-675b-instruct-2512
      ## NVIDIA
      - nvidia/llama-3.3-nemotron-super-49b-v1.5
      ## MiniMax
      - minimaxai/minimax-m2.7                         # slow (~40s), batch/cron use
      ## PRUNED 2026-07-15 (validated dead, all failed a warm one-word probe):
      ##   moonshotai/kimi-k2.6                    404 Function not found (account)
      ##   qwen/qwen3-next-80b-a3b-instruct        hang > 60s
      ##   qwen/qwen3-next-80b-a3b-thinking        410 Gone (decommissioned)
      ##   qwen/qwen3-coder-480b-a35b-instruct     410 Gone (decommissioned)
      ##   openai/gpt-oss-120b                     hang > 60s
      ##   meta/llama-3.3-70b-instruct             hang > 60s
      ##   google/gemma-4-31b-it                   hang > 90s
      ##   bytedance/seed-oss-36b-instruct         hang > 90s
      ##   mistralai/ministral-14b-instruct-2512   hang > 60s
    priority: 1

  anthropic:
    # Route Claude models through the LOCAL Claude Code client wrapper
    # (claude-code-api :18782 = `claude --print`) so they bill as genuine
    # FIRST-PARTY subscription usage. Hitting api.anthropic.com directly with the
    # raw OAuth token is treated by Anthropic as a third-party app that draws from
    # extra-usage (not the plan), which starves the subscription and 400s under
    # load. The wrapper IS Claude Code, so it uses the plan correctly.
    # OpenAI-compatible wrapper; the shared secret is supplied from the
    # service EnvironmentFile and never committed.
    url: http://127.0.0.1:18782/v1
    auth_type: api_key
    api_key_env: CCAPI_TOKEN
    discovery: anthropic
    models: &claude_cold_start_models
      - claude-fable-5
      - claude-haiku-4-5
      - claude-haiku-4-5-20251001
      - claude-opus-4-5-20251101
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-opus-5
      - claude-sonnet-4-5-20250929
      - claude-sonnet-4-6
      - claude-sonnet-5
    priority: 2
    # SPOF fail-fast: the wrapper is a single local service outside this repo.
    # If it wedges (accepts the socket but never replies) the request would hang
    # forever with no failover. This idle timeout aborts a stalled wrapper call
    # with a 504 so the router fails over to anthropic-direct below. Generous
    # enough for a real `claude --print` completion; a live stream resets it on
    # each chunk, so only a truly stalled upstream trips it.
    timeout_ms: 120000

  ## EMERGENCY FALLBACK for claude-* when the :18782 wrapper is down/wedged.
  ## Same models, LOWER priority (higher number) than the wrapper, so the router
  ## only reaches it after the wrapper fails (failover on 5xx/504). This is a
  ## DEGRADED path: hitting api.anthropic.com with the raw subscription OAuth
  ## token bills as third-party extra-usage (not the plan) and can 400 under
  ## load — acceptable as a last resort to keep claude-* answering, not as the
  ## steady state. auth_type oauth → the anthropic-adapter translates
  ## OpenAI→Messages and attaches the token from the Claude Code creds file.
  ## Mitigates SPOF card 2b5bcedd (RUNBOOK "claude-code-api wrapper dependency").
  anthropic-direct:
    url: https://api.anthropic.com/v1
    auth_type: oauth
    credentials_path: ~/.claude/.credentials.json
    discovery: anthropic
    models: *claude_cold_start_models
    priority: 8
    timeout_ms: 120000

  ollama:
    url: http://192.168.0.100:11434/v1
    auth_type: none
    models:
      - "dolphin-*"
    priority: 3

  openrouter:
    url: https://openrouter.ai/api/v1
    auth_type: api_key
    api_key_env: OPENROUTER_API_KEY
    discovery: free
    max_concurrent: 10

tools:
  guaranteed:
    - exec
    - read
    - write
    - edit
    - message
  max_budget: 16
  fallback_budget: 8
  call_limit: 10

# Streaming → non-streaming auto-flip.  Tool-heavy or large-context turns
# hit NVIDIA NIM streaming instability (connection drops mid-stream at ~10k
# tokens).  When any trigger below matches, the proxy forces `stream:false`
# upstream, buffers the complete JSON, and re-emits SSE to the client so
# the streaming contract is preserved without the mid-stream-drop failure
# mode.  Tool requests already non-stream upstream (see core.mjs); this
# covers non-tool traffic and explicit opt-in.
streaming:
  default: true
  force_header: x-skgateway-nonstream        # value 'force' or '1'
  auto_nonstream:
    enabled: true
    trigger_if_body_bytes_ge: 40000          # ~10k tokens
    trigger_if_messages_ge: 6
    trigger_if_tool_call_history_ge: 3
    aggressive_models:
      - moonshotai/kimi-k2.6
      - qwen/qwen3-next-80b-a3b-instruct
      - qwen/qwen3-next-80b-a3b-thinking
      - deepseek-ai/deepseek-v4-flash
      - deepseek-ai/deepseek-v4-pro

sanitizer:
  max_system_bytes: 40000       # global default — ~10K tokens
  max_body_bytes: 120000        # global default — ~30K tokens
  keep_start: 2
  keep_end: 12
  strip_thinking: true

# Per-model context limits.  Formula: max_body_bytes = context_tokens * 4 bytes * 0.80
# max_system_bytes = max_body_bytes * 0.40.  Values from NVIDIA NIM model cards (2026-05-12).
model_limits:
  ## 64K qualified live context (Ornith 1.5 Q6_K on .100:8082). Do not
  ## advertise the model's larger 262K training window.
  ornith-1.5-9b:                              { max_body_bytes: 209715,   max_system_bytes: 83886   }
  ## 256K context (ornith-1.0-35b on Tyler's .150/.153:8087 — verified n_ctx=256000)
  ornith-1.0-35b:                             { max_body_bytes: 800000,   max_system_bytes: 320000  }
  ornith-big:                                 { max_body_bytes: 800000,   max_system_bytes: 320000  }  # alias of ornith-1.0-35b
  ## 256K context (Huihui Qwen3.8 27B on chiap08 :11439, CTX_SIZE=262144) —
  ## the exact served id and all compatibility aliases carry the same limits.
  qwen3.8-27b-huihui-abliterated-q4_k_m:      { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-27b-ud-q5_k_xl:                     { max_body_bytes: 800000,   max_system_bytes: 320000  }
  qwen3.8-27b:                                { max_body_bytes: 800000,   max_system_bytes: 320000  }  # short alias of the Huihui served id
  qwen38-abliterated:                         { max_body_bytes: 800000,   max_system_bytes: 320000  }  # 2026-08-18: custom alias of the same chiap08 :11439 model (incident inc-2026-08-18-qwen38-eol)
  ## 256K context (kimi-k2.6)
  moonshotai/kimi-k2.6:                       { max_body_bytes: 800000,   max_system_bytes: 320000  }
  ## 262K context (Qwen3 family, Mistral family, Gemma 4)
  qwen/qwen3-next-80b-a3b-instruct:           { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3-next-80b-a3b-thinking:           { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3-coder-480b-a35b-instruct:        { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3.5-122b-a10b:                     { max_body_bytes: 838000,   max_system_bytes: 335000  }
  qwen/qwen3.5-397b-a17b:                     { max_body_bytes: 838000,   max_system_bytes: 335000  }
  mistralai/mistral-medium-3.5-128b:          { max_body_bytes: 838000,   max_system_bytes: 335000  }
  mistralai/mistral-large-3-675b-instruct-2512: { max_body_bytes: 838000, max_system_bytes: 335000  }
  mistralai/ministral-14b-instruct-2512:      { max_body_bytes: 838000,   max_system_bytes: 335000  }
  google/gemma-4-31b-it:                      { max_body_bytes: 838000,   max_system_bytes: 335000  }
  ## 1M context (DeepSeek V4 — cap at 2M bytes practical limit)
  deepseek-ai/deepseek-v4-flash:              { max_body_bytes: 2000000,  max_system_bytes: 800000  }
  deepseek-ai/deepseek-v4-pro:               { max_body_bytes: 2000000,  max_system_bytes: 800000  }
  ## 512K context (ByteDance Seed OSS)
  bytedance/seed-oss-36b-instruct:            { max_body_bytes: 1638000,  max_system_bytes: 655000  }
  ## 204K context (MiniMax M2.7)
  minimaxai/minimax-m2.7:                     { max_body_bytes: 655000,   max_system_bytes: 262000  }
  ## 128K context (GPT-OSS, Llama 3.3)
  openai/gpt-oss-120b:                        { max_body_bytes: 409000,   max_system_bytes: 164000  }
  openai/gpt-oss-20b:                         { max_body_bytes: 409000,   max_system_bytes: 164000  }
  meta/llama-3.3-70b-instruct:               { max_body_bytes: 409000,   max_system_bytes: 164000  }
  ## 131K context (Nemotron Super 49B)
  nvidia/llama-3.3-nemotron-super-49b-v1.5:  { max_body_bytes: 419000,   max_system_bytes: 168000  }

