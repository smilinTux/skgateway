name: secret-scan

# Fleet secret-scan gate: runs the gitleaks BINARY, not gitleaks-action.
#
# The action requires a paid license for ORGANIZATION-owned repos, and smilinTux
# is an org, so it exits with "missing gitleaks license" BEFORE scanning a single
# byte. skcomms carried exactly that gate for months: permanently red, therefore
# ignored, and scanning nothing at all. gitleaks itself is MIT and free; only the
# wrapper is licensed, so calling the binary restores real scanning at no cost
# with no org secret to provision.
#
# Pinned to an exact version so a new upstream rule cannot redden CI without a
# deliberate bump. --redact keeps a genuine finding out of public CI logs.
# --exit-code 1 fails the build on a finding.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the scan walks commits, not just the tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # FULL history, filtered by a committed baseline of pre-existing findings.
      #
      # This repo had 2 findings already in its history when scanning was first
      # switched on, so the gate began by scanning only new commits: a full scan
      # would have been red from day one and would have been ignored, which is
      # the exact failure this gate exists to prevent.
      #
      # The baseline records those known findings by fingerprint, so the scan now
      # covers EVERY commit and fails only on something NOT already known. That
      # is strictly stronger than the incremental scan it replaces, and the
      # backlog is now visible in-repo (.gitleaks-baseline.json) where it can be worked off.
      #
      # Shrinking the baseline is the cleanup task. NEVER regenerate it to make a
      # new finding disappear: that is how a real secret gets rubber-stamped.
      - name: Scan (full history, baseline-filtered)
        run: |
          set -euo pipefail
          CFG=""
          [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          # --log-opts HEAD scopes the walk to commits REACHABLE FROM THIS
          # REF. This is NOT the incremental scan the comment above forbids:
          # it still walks the full history of this branch. What it excludes is
          # OTHER branches.
          #
          # Without it, `detect --source .` walks the whole object store, and
          # actions/checkout with fetch-depth 0 brings down every remote branch.
          # A PR then fails on a secret that is not in the PR, is not in main,
          # and that its author cannot see or fix.
          #
          # PROVEN on this repo 2026-09-01, branch feat/skgw-admission-failover:
          #   whole object store   321 commits scanned, leaks found: 1
          #   scoped to HEAD       293 commits scanned, no leaks found
          # The single finding was rule generic-api-key in
          # tests/client-auth-failclosed.test.mjs at commit f64a1774, which
          # lives only on remotes/origin/feat/14436d93-bind-auth-shared-profile
          # and is not reachable from the PR branch at all. The value was an
          # 18-character synthetic test fixture, hashed on the next line.
          #
          # Coverage per branch is unchanged: every branch is still scanned in
          # full when ITS OWN pull request runs. What is removed is one branch
          # failing another branch's build.
          gitleaks detect --source . $CFG --baseline-path .gitleaks-baseline.json \
            --log-opts HEAD --redact --no-banner --exit-code 1
