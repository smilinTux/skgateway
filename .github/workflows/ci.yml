name: CI

# The real test gate. Card 62a5256d.
#
# Before this file existed, the ONLY test invocation in skgateway CI lived in
# publish.yml. That workflow is tags-only, its test step redirected stderr away
# and swallowed a non-zero exit, and the job was additionally marked so a failure
# could not stop it. Nothing about a push or a pull request was ever tested, and a
# red suite still published to npm. See SOP.md section 4 for the full table.
#
# Nothing in this file may swallow a failure. No shell success-guard on the test
# step, no output redirection, no job-level failure tolerance. If a change seems
# to need one, the change is the problem.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 20. publish.yml builds on 20, so
        # 20 is the version that actually ships; 22 is the current LTS the suite
        # is developed against.
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Plain `npm ci`, deliberately. better-sqlite3 resolves its native binding
      # through an install script, and suppressing install scripts here makes 19
      # metrics, energy and SIEM tests fail with "Could not locate the bindings
      # file" rather than on their own merits.
      - run: npm ci
      - run: npm test
