## Dynamic provider model discovery: periodically polls each declared
## backend's model-list endpoint and folds newly seen models into the
## effective model set, instead of relying solely on the static `models`
## arrays above.
discovery:
  enabled: true
  refresh_seconds: 3600
  # Card 1f65cf45 (C3) wired these; card fix/probe-failure-escalation made the
  # sweep actually able to retire a model that never answers (before it, a
  # timeout demoted to suspect and stopped, leaving it advertised forever).
  # Daily cadence, 20 models per sweep, so full coverage of ~67 advertised ids
  # takes a few days. Each probe is a REAL upstream completion: this is a
  # cost ceiling, not a display limit.
  probe_seconds: 86400
  probe_budget: 20
  probe_timeout_ms: 15000
  # Card 0e010400 (2026-09-04): one sweep per provider listed here, each on
  # its own backend endpoint and pool bucket. The capability battery
  # (tool_call / structured_output / instruction_following /
  # min_output_tokens, src/discovery/capability-assessment.mjs) rides the
  # sweep for every provider with capability_battery: true. Capability is
  # MEASURED by a real completion, never inferred from the model name; a
  # 429/timeout/5xx records unmeasured, never fail. scope `provider` means
  # actively-used models are eligible too, not only the 7-day long tail.
  probe_providers: [nvidia, openrouter]
  capability_budget: 8
  capability_interval_seconds: 2592000
  capability_timeout_ms: 30000
  capability_scope: provider
  providers:
    anthropic:  { enabled: true, free_only: false, chat_only: true }
    nvidia:     { enabled: true, free_only: true, chat_only: true, capability_battery: true }
    openrouter: { enabled: true, free_only: true, chat_only: true, capability_battery: true }

    # Disabled 2026-08-29: OPENCODE_API_KEY is not set anywhere and Chef has no
    # key, so every one of its 9 advertised models returns 403. auth_optional
    # let it try keyless and fail. Re-enable if a key ever lands.
    opencode:   { enabled: false, free_only: true, chat_only: true }
## Joule-economy P0 metering (energy_log). Reads a skmeter energy counter
## around each upstream attempt. Shadow mode ships OFF: no meter reads, no
## behavior change, until this node's meter config has been validated.
energy:
  enabled: true
  read_timeout_ms: 250
  meters:
    # A meter measures a NODE, not a backend, so key it by HOST. Backend NAMES
    # cannot cover every alias: the same .100 GPU is reached as `local`,
    # `ornith`, `ollama`, and as the registry-routed synthetic id `reg:ornith`,
    # which is what actually lands in energy_log. Host keys catch all of them.
    "192.168.0.100": "http://100.127.233.81:9420/energy"
    "192.168.0.100:8082": "http://100.127.233.81:9420/energy"
    local: "http://100.127.233.81:9420/energy"
  # Locality wins over the URL heuristic. The anthropic backend is a loopback
  # WRAPPER on 127.0.0.1:18782, so a URL test would call it local and file
  # Anthropic's datacenter energy as imputed_local.
  locality:
    anthropic: remote
  coefficients:
    # CURATED ENTRIES WIN over id-derivation, so a wrong entry here is worse
    # than no entry. Anything NOT listed is derived from the parameter count
    # encoded in the model id (MoE ids use ACTIVE params) at 0.106 J per token
    # per billion. Derivation and its uncertainty: src/metrics/energy.mjs.
    #
    # ornith: MEASURED, not derived. 600 output tokens cost 1713 J marginal on
    # .100's RTX 5060 Ti (2026-08-15) = 2.85 J/token. Derivation would apply
    # the datacenter discount and return 0.95, understating our OWN energy
    # threefold and making local look artificially cheap against cloud.
    # Input tokens: prefill is roughly a tenth of decode per token, and the
    # anchor already folded a short 51-token prompt into the output figure.
    ornith:      { j_per_input_token: 0.285, j_per_output_token: 2.85 }
    # Frontier models publish no parameter count, so the id cannot be parsed
    # and derivation correctly returns null. This ESTIMATE stands in for that,
    # assuming roughly 400B active-equivalent. Lowest-confidence number here.
    claude-:     { j_per_input_token: 4.2, j_per_output_token: 42.0 }
    # NOTE: there is deliberately NO `openai/` entry. It used to be 0, and a
    # curated 0 beats derivation, so every openai/* model recorded as costing
    # nothing. Free in DOLLARS is not free in JOULES: somebody's datacenter
    # burns real power. Zeroing cloud energy would make the cheapest strategy
    # "send everything off-box" and the joule economy would reward shipping
    # work off your own hardware, inverting the whole point. Let it derive.
# Graded model selection, card 6dff5c17. Enabled 2026-08-16 by Chef's decision,
# AFTER skgateway PRs #34 and #35 merged and deployed. Before those, every bucket
# resolution threw ReferenceError, so enabling this flag earlier would have armed
# a path that could not run.
#
# buckets_enabled ONLY, deliberately. sensitivity_enforced is inert without
# match_enabled (only match_enabled populates request.requirements, which
# requestZoneCeiling reads), so enabling it alone would produce a gate that looks
# enforced and enforces nothing. And the shadow soak for sensitivity happens while
# sensitivity_enforced is OFF: that is when it logs "would block". Turning it on
# ends the soak rather than starting it.
routing:
  buckets_enabled: true

# Task 2 (2026-10-02 nextcloud-recording-local-ai): local-only STT + embeddings
# for Nextcloud Talk recording transcription and semantic search. sk-stt is
# whisper.cpp large-v3-turbo on .100 (model id whisper-1), sk-embed is the
# mxbai-embed-large embedding server also on .100. No Tailscale fallback: a
# down backend returns an error, never a cloud substitution (see README
# "Speech-to-text and embeddings").
media:
  aliases:
    sk-stt:   { kind: stt,   url: "http://192.168.0.100:18794/v1/audio/transcriptions", model: "whisper-1",         timeout_ms: 600000 }
    sk-embed: { kind: embed, url: "http://192.168.0.100:11438/v1/embeddings",            model: "mxbai-embed-large", timeout_ms: 30000 }
  max_concurrent_stt: 2
  max_concurrent_embed: 8

